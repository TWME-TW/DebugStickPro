# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: DebugStickPro
          path: target/DebugStickPro-0.5.3.jar

  runtime-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: paper Java 17
            id: paper-java17
            platform: paper
            java: 17
            cases: >-
              1.19.4:mineflayer
              1.20:startup
              1.20.1:startup
              1.20.2:startup
              1.20.4:mineflayer
          - name: paper Java 21 (1.20-1.21.4)
            id: paper-java21-early
            platform: paper
            java: 21
            cases: >-
              1.20.5:startup
              1.20.6:mineflayer
              1.21:startup
              1.21.1:mineflayer
              1.21.3:startup
              1.21.4:startup
          - name: paper Java 21 (1.21.5-1.21.11)
            id: paper-java21-late
            platform: paper
            java: 21
            cases: >-
              1.21.5:startup
              1.21.6:startup
              1.21.7:startup
              1.21.8:startup
              1.21.9:startup
              1.21.10:startup
              1.21.11:startup
          - name: paper Java 25
            id: paper-java25
            platform: paper
            java: 25
            cases: >-
              26.1.1:startup
              26.1.2:startup
              26.2:startup
          - name: folia Java 17
            id: folia-java17
            platform: folia
            java: 17
            cases: >-
              1.19.4:mineflayer
              1.20.1:startup
              1.20.2:startup
              1.20.4:mineflayer
          - name: folia Java 21
            id: folia-java21
            platform: folia
            java: 21
            cases: >-
              1.20.6:mineflayer
              1.21.4:startup
              1.21.5:startup
              1.21.6:startup
              1.21.8:startup
              1.21.11:startup
          - name: folia Java 25
            id: folia-java25
            platform: folia
            java: 25
            cases: >-
              26.1.2:startup
              26.2:startup

    name: ${{ matrix.name }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integration/mineflayer/package-lock.json
      - name: Download plugin JAR
        uses: actions/download-artifact@v8
        with:
          name: DebugStickPro
          path: target
      - name: Cache test servers
        uses: actions/cache@v5
        with:
          path: ~/.cache/debugstickpro-e2e
          key: debugstickpro-runtime-v2-${{ matrix.id }}
      - name: Run server integration test
        env:
          DSP_E2E_PLATFORM: ${{ matrix.platform }}
          DSP_E2E_CASES: ${{ matrix.cases }}
        run: integration/mineflayer/run-version-group.sh
