# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload JAR
        uses: actions/upload-artifact@v7
        with:
          name: DebugStickPro
          path: target/DebugStickPro-0.5.3.jar

  runtime-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: paper
            minecraft: 1.19.4
            java: 17
            mode: mineflayer
          - platform: folia
            minecraft: 1.19.4
            java: 17
            mode: mineflayer
          - platform: paper
            minecraft: '26.2'
            java: 25
            mode: startup
          - platform: folia
            minecraft: '26.2'
            java: 25
            mode: startup

    name: ${{ matrix.platform }} ${{ matrix.minecraft }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: integration/mineflayer/package-lock.json
      - name: Download plugin JAR
        uses: actions/download-artifact@v8
        with:
          name: DebugStickPro
          path: target
      - name: Cache test servers
        uses: actions/cache@v5
        with:
          path: ~/.cache/debugstickpro-e2e
          key: debugstickpro-${{ matrix.platform }}-${{ matrix.minecraft }}
      - name: Run server integration test
        env:
          DSP_E2E_PLATFORM: ${{ matrix.platform }}
          DSP_E2E_VERSION: ${{ matrix.minecraft }}
          DSP_E2E_MODE: ${{ matrix.mode }}
        run: integration/mineflayer/run-server-e2e.sh
